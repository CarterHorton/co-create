# Check every pull request: type-check, lint, unit tests, production build.
#
# This workflow uses no secrets. The Playwright browser tests and deploys need
# a DeepSpace login, so they stay local for now:
#   npx deepspace test run all
#   npx deepspace deploy

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
